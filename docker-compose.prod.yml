services:
  postgres:
    image: postgres:16-alpine
    container_name: dc_vision_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dc_vision}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dc_vision"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dc_vision_net

  redis:
    image: redis:7-alpine
    container_name: dc_vision_redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dc_vision_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dc_vision_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dc_vision_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: dc_vision_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - dc_vision_net

networks:
  dc_vision_net:
    driver: bridge

volumes:
  postgres_data:
    name: dc_vision_postgres_data
  redis_data:
    name: dc_vision_redis_data
